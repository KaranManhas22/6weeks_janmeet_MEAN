name: Deploy Node.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ubuntu
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /home/ubuntu/6weeks_janmeet_MEAN
            git pull origin main
            sudo npm install 
            sudo npm run build 
            pm2 delete frontend
            pm2 start http-server --name frontend -- dist/front-end -p 4200
